
name: Build resume

on:
  push:
    branches: [ main_bendavisnc ]
  pull_request:
    branches: [ main_bendavisnc ]

  # Enable manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  build-resume:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true  # Cache gems to speed up builds

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - run: npm install -g less

      - name: Generate Resume
        run: |
          chmod +x personal.sh
          ./personal.sh

      - name: Delete old resume
        uses: mknejp/delete-release-assets@v1
        with:
          token: ${{ github.token }}
          tag: latest
          assets: '*.*'
          fail-if-no-assets: false
          fail-if-no-release: false

      - name: Release new resume
        uses: softprops/action-gh-release@v1
        with:
          files: ./resume.pdf
          tag_name: latest
        