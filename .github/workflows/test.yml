name: Run tests

on: push

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: exiftool

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - run: npm install -g less

      - run: bundle exec rspec --format documentation
